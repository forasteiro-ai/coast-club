<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080b11">
<title>Coast Club & Barber Shop · Agendamento</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Coast Club">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" type="image/png" sizes="64x64" href="favicon.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<style>
:root{
  --bg:#080b11; --bg2:#0d1219; --card:#111821; --card2:#18222d; --line:#233040;
  --txt:#f4f2ee; --dim:#8f9bab; --gold:#c9a24d; --gold2:#e3c896;
  --ok:#3fb27f; --warn:#e0a63a; --err:#e05656;
  --r:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:radial-gradient(1100px 560px at 50% -12%,#152030 0%,var(--bg) 58%) fixed,var(--bg);
  color:var(--txt);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  padding-bottom:92px;min-height:100vh;-webkit-font-smoothing:antialiased;
}
h1,h2,h3{margin:0;font-weight:650;letter-spacing:-.01em}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select{font:inherit;color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
header.top{position:sticky;top:0;z-index:20;backdrop-filter:blur(14px);
  background:linear-gradient(180deg,rgba(11,11,13,.96),rgba(11,11,13,.78));border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;height:60px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:36px;height:36px;border-radius:10px;flex:0 0 auto;
  object-fit:contain;display:block;background:#080b11;
  box-shadow:0 4px 14px rgba(0,0,0,.5),0 0 0 1px rgba(201,162,77,.35)}
.brand b{display:block;font-size:14.5px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand span{display:block;font-size:11.5px;color:var(--dim);letter-spacing:.04em}
.pill{margin-left:auto;font-size:11px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--gold2);border:1px solid rgba(201,162,77,.35);background:rgba(201,162,77,.08);
  padding:6px 10px;border-radius:999px;white-space:nowrap}

.hero{padding:0 0 6px}
.herophoto{position:relative;width:100%;aspect-ratio:4/3;border-radius:20px;overflow:hidden;
  margin:0 0 18px;box-shadow:0 14px 40px rgba(0,0,0,.6),0 0 0 1px rgba(201,162,77,.25)}
.herophoto img{width:100%;height:100%;object-fit:cover;display:block}
.herophoto::after{content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(8,11,17,.05) 0%,rgba(8,11,17,.30) 55%,rgba(8,11,17,.92) 100%)}
.herophoto .cap{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:16px 16px 14px}
.herophoto .cap .nm{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold2);font-weight:700}
.herophoto .cap .tt{font-size:15px;color:#fff;margin-top:3px;line-height:1.3}
.hero-logo{width:96px;height:auto;display:block;margin:0 0 14px;border-radius:14px;
  box-shadow:0 10px 30px rgba(0,0,0,.55),0 0 0 1px rgba(201,162,77,.22)}

/* galeria de ambiente */
.gal{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0 0}
.gal img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:14px;display:block;
  box-shadow:0 6px 18px rgba(0,0,0,.45);border:1px solid var(--line)}
.gal .wide{grid-column:1 / -1;aspect-ratio:16/10}
.hero h1{font-size:26px;line-height:1.15}
.hero h1 em{font-style:normal;color:var(--gold2)}
.hero p{color:var(--dim);margin:8px 0 0;font-size:14px}
.avail{margin-top:14px;display:flex;flex-wrap:wrap;gap:8px}
.tag{font-size:12px;color:var(--dim);border:1px solid var(--line);background:var(--card);
  padding:6px 10px;border-radius:999px}
.tag i{color:var(--gold2);font-style:normal}

.steps{display:flex;gap:6px;margin:20px 0 10px}
.steps div{flex:1;height:3px;border-radius:2px;background:var(--line);transition:.25s}
.steps div.on{background:var(--gold)}

h2.sec{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);
  margin:22px 0 10px;font-weight:600}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.svc{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px;
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:8px;
  transition:.15s}
.svc:active{transform:scale(.99)}
.svc.sel{border-color:var(--gold);background:linear-gradient(180deg,rgba(201,162,77,.10),rgba(201,162,77,.03))}
.svc .ico{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex:0 0 auto;
  background:var(--card2);border:1px solid var(--line);font-size:17px}
.svc.sel .ico{background:rgba(201,162,77,.15);border-color:rgba(201,162,77,.4)}
.svc .nm{font-size:15px;font-weight:560}
.svc .mt{font-size:12px;color:var(--dim);margin-top:2px}
.svc .pr{margin-left:auto;text-align:right;font-weight:650;color:var(--gold2);font-size:15px;white-space:nowrap}
.svc .pr small{display:block;color:var(--dim);font-weight:400;font-size:11px}

/* date strip */
.strip{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.dchip{flex:0 0 auto;width:60px;padding:10px 0;text-align:center;border-radius:13px;
  background:var(--card);border:1px solid var(--line);transition:.15s}
.dchip .w{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.dchip .d{font-size:19px;font-weight:680;margin:2px 0 0;line-height:1.1}
.dchip.sel{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#14100a;border-color:transparent}
.dchip.sel .w{color:rgba(20,16,10,.65)}
.dchip[disabled]{opacity:.32}

.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.slot{padding:12px 0;border-radius:12px;background:var(--card);border:1px solid var(--line);
  font-weight:600;font-size:14.5px;transition:.15s}
.slot.sel{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#14100a;border-color:transparent}
.slot[disabled]{opacity:.3;text-decoration:line-through}
.slot.taken{border-style:dashed}
.hint{font-size:12.5px;color:var(--dim);margin:10px 0 0}

label.f{display:block;margin:12px 0 0}
label.f span{display:block;font-size:12.5px;color:var(--dim);margin-bottom:6px}
.inp{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:12px;
  padding:13px 14px;font-size:15.5px;outline:none;transition:.15s}
.inp:focus{border-color:var(--gold);background:#16161b}
.inp::placeholder{color:#5d5d68}
.row{display:flex;gap:10px}
.row>*{flex:1}

.btn{display:block;width:100%;padding:15px;border-radius:13px;font-weight:650;font-size:15.5px;
  background:linear-gradient(180deg,var(--gold2),var(--gold));color:#14100a;transition:.15s;
  box-shadow:0 8px 22px rgba(201,162,77,.16)}
.btn:active{transform:scale(.99)}
.btn[disabled]{opacity:.4;box-shadow:none}
.btn.ghost{background:var(--card);border:1px solid var(--line);color:var(--txt);box-shadow:none}
.btn.danger{background:rgba(224,86,86,.12);border:1px solid rgba(224,86,86,.4);color:#ff9b9b;box-shadow:none}
.btn.sm{padding:10px 12px;font-size:13.5px;border-radius:10px;width:auto;display:inline-block}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.actions .btn{flex:1;min-width:130px}

.back{display:inline-flex;align-items:center;gap:6px;color:var(--dim);font-size:13.5px;margin:16px 0 0}

.opt{display:flex;align-items:center;gap:12px;padding:14px;border:1px solid var(--line);
  border-radius:var(--r);background:var(--card);margin-bottom:8px;width:100%;text-align:left}
.opt.sel{border-color:var(--gold);background:linear-gradient(180deg,rgba(201,162,77,.10),rgba(201,162,77,.03))}
.opt .ico{font-size:19px}
.opt .nm{font-weight:600;font-size:15px}
.opt .mt{font-size:12px;color:var(--dim)}
.dot{margin-left:auto;width:19px;height:19px;border-radius:50%;border:2px solid var(--line);flex:0 0 auto}
.opt.sel .dot{border-color:var(--gold);background:radial-gradient(circle,var(--gold) 0 45%,transparent 46%)}

.sum{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:16px}
.sum .l{display:flex;justify-content:space-between;font-size:14px;color:var(--dim);padding:4px 0}
.sum .l b{color:var(--txt);font-weight:560}
.sum .tot{display:flex;justify-content:space-between;font-size:17px;font-weight:700;
  border-top:1px solid var(--line);margin-top:8px;padding-top:10px}
.sum .tot span:last-child{color:var(--gold2)}

.qr{width:190px;height:190px;margin:14px auto;background:#fff;border-radius:14px;padding:10px;
  display:grid;grid-template-columns:repeat(25,1fr);grid-template-rows:repeat(25,1fr);gap:0}
.qr i{background:#fff}
.qr i.b{background:#0b0b0d}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;color:var(--dim);
  background:var(--bg2);border:1px dashed var(--line);border-radius:10px;padding:10px;word-break:break-all;text-align:left}

.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:650;letter-spacing:.04em;
  text-transform:uppercase;padding:4px 9px;border-radius:999px}
.badge.pago{color:#8de3bb;background:rgba(63,178,127,.14);border:1px solid rgba(63,178,127,.35)}
.badge.pendente{color:#f0c477;background:rgba(224,166,58,.13);border:1px solid rgba(224,166,58,.35)}
.badge.cancelado{color:#ff9b9b;background:rgba(224,86,86,.13);border:1px solid rgba(224,86,86,.32)}

.bk{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px}
.bk .hd{display:flex;align-items:flex-start;gap:10px}
.bk .tm{font-size:21px;font-weight:750;letter-spacing:-.02em;line-height:1;color:var(--gold2);min-width:64px}
.bk .nm{font-weight:620}
.bk .mt{font-size:12.5px;color:var(--dim);margin-top:3px}
.bk .rt{margin-left:auto;text-align:right}
.bk .vt{font-weight:680;font-size:14.5px;margin-top:8px}
.bk .mini{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.bk.done{opacity:.55}

.empty{text-align:center;padding:44px 16px;color:var(--dim);font-size:14px}
.empty .e{font-size:30px;display:block;margin-bottom:10px;opacity:.6}

.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.kpi div{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:11px}
.kpi .k{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--dim)}
.kpi .v{font-size:17px;font-weight:700;margin-top:3px}
.kpi .v.g{color:#8de3bb}
.kpi .v.y{color:#f0c477}

nav.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:30;padding:8px 0 max(8px,env(safe-area-inset-bottom));
  background:rgba(13,13,16,.94);backdrop-filter:blur(16px);border-top:1px solid var(--line)}
nav.tabbar .in{max-width:560px;margin:0 auto;display:flex;padding:0 8px}
nav.tabbar button{flex:1;display:grid;place-items:center;gap:3px;padding:7px 0;border-radius:12px;
  color:var(--dim);font-size:10.5px;letter-spacing:.03em}
nav.tabbar button .g{font-size:19px;line-height:1}
nav.tabbar button.on{color:var(--gold2)}

.depbox{border:1.5px solid rgba(224,166,58,.55);background:rgba(224,166,58,.10);
  border-radius:var(--r);padding:14px;margin:14px 0}
.depbox .dt{font-size:13px;font-weight:700;color:#f0c477;margin-bottom:8px;letter-spacing:.02em}
.depbox p{margin:0 0 8px;font-size:12.5px;line-height:1.55;color:#e8e2d4}
.depbox p:last-child{margin-bottom:0}
.depbox .strong{color:#ffd98a;font-weight:700}
.depbox ul{margin:6px 0 0;padding-left:18px;font-size:12.5px;line-height:1.6;color:#e8e2d4}
.depbox li{margin-bottom:4px}
.toast{position:fixed;left:50%;bottom:104px;transform:translate(-50%,14px);z-index:60;
  background:#23232b;border:1px solid var(--line);color:var(--txt);font-size:13.5px;
  padding:11px 16px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.5);
  opacity:0;pointer-events:none;transition:.25s;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}

.spin{width:20px;height:20px;border:2.5px solid rgba(20,16,10,.25);border-top-color:#14100a;
  border-radius:50%;animation:sp .7s linear infinite;display:inline-block;vertical-align:-4px;margin-right:8px}
@keyframes sp{to{transform:rotate(360deg)}}

.done-hero{text-align:center;padding:26px 0 8px}
.done-hero .ck{width:74px;height:74px;border-radius:50%;margin:0 auto 16px;display:grid;place-items:center;
  font-size:34px;color:#0b0b0d;background:linear-gradient(180deg,var(--gold2),var(--gold));
  box-shadow:0 0 0 8px rgba(201,162,77,.10)}
.done-hero h1{font-size:23px}
.done-hero p{color:var(--dim);font-size:14px;margin:8px 0 0}
.proto{font-family:ui-monospace,Menlo,monospace;font-size:13px;color:var(--gold2);
  border:1px dashed rgba(201,162,77,.4);border-radius:10px;padding:9px 14px;display:inline-block;margin-top:14px}

.wa{background:rgba(37,211,102,.12);border:1px solid rgba(37,211,102,.35);color:#7ddea4}
.tinynote{font-size:11.5px;color:#6f6f79;margin-top:10px;text-align:center}
.subnav{display:flex;gap:6px;margin:14px 0 4px;background:var(--bg2);padding:4px;border-radius:12px;border:1px solid var(--line)}
.subnav button{flex:1;padding:9px;border-radius:9px;font-size:13px;color:var(--dim);font-weight:560}
.subnav button.on{background:var(--card2);color:var(--txt)}
.svcrow{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.svcrow .inp{padding:10px 12px;font-size:14px}
.svcrow .nm{flex:2}
.svcrow .pv{flex:1;max-width:104px}
.svcrow .del{flex:0 0 auto;color:#ff9b9b;padding:8px;font-size:16px}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="brand">
      <img class="mark" src="logo.jpg" alt="Coast Club & Barber Shop">
      <div>
        <b id="shopName">Coast Club &amp; Barber Shop</b>
        <span id="shopHandle">@coastclub_barbershop</span>
      </div>
    </div>
    <div class="pill">Agenda</div>
  </div>
</header>

<main id="view" class="wrap"></main>

<nav class="tabbar">
  <div class="in">
    <button data-act="tab" data-tab="agendar" id="tb-agendar"><span class="g">✂️</span>Agendar</button>
    <button data-act="tab" data-tab="meus" id="tb-meus"><span class="g">🎫</span>Meus</button>
    <button data-act="tab" data-tab="painel" id="tb-painel"><span class="g">💈</span>Painel</button>
  </div>
</nav>

<div class="toast" id="toast"></div>
<script>

/* ============================================================
   Coast Club & Barber Shop · agendamento
   Modo LOCAL (padrão, sem configurar nada) ou modo NUVEM (Supabase).
   A tela é a mesma nos dois; o que muda é onde os dados vivem.
   ============================================================ */
const KEY  = 'coastclub.v1';   // dados locais / cache
const CATALOG_VERSION = 2;      // sobe quando a tabela de preços oficial muda
const CKEY = 'coastclub.cfg';  // configuração do backend

const DEFAULTS = {
  shop: 'Coast Club & Barber Shop',
  handle: '@coastclub_barbershop',
  ownerName: 'Igor',
  ownerWhats: '(11) 99560-6334',
  openHour: 8,
  closeHour: 17,
  lunchHour: 12,
  pin: '1234',
  depositPct: 30,
  maxActive: 1,
  services: [
    { id:'corte-adulto',   name:'Corte Adulto',        price:35, ico:'✂️' },
    { id:'corte-infantil', name:'Corte Infantil',      price:35, ico:'🧒' },
    { id:'barba',          name:'Barba',               price:20, ico:'🪒' },
    { id:'sobrancelha',    name:'Sobrancelha',         price:15, ico:'👁️' },
    { id:'limpeza',        name:'Limpeza de Pele',     price:30, ico:'🧖' },
    { id:'luzes',          name:'Luzes',               price:60, ico:'💡' },
    { id:'nevou',          name:'Platinado / Nevou',   price:75, ico:'🤍' },
    { id:'pezinho',        name:'Pézinho',             price:15, ico:'🦶' },
    { id:'risquinho',      name:'Risquinho / Desenho', price:15, ico:'📐' }
  ],
  coupons: [ { code:'COAST10', pct:10 } ],
  bookings: [],
  seq: 1,
  catalogVersion: CATALOG_VERSION
};

const DEFAULTS_CFG = { url:'https://fjxrkfliobdzvrwqnmme.supabase.co', key:'sb_publishable_0t4lsQz3A_RQWsnWaQQbmw_uBnAQzQ2', ownerEmail:'igorgustavodelima@hotmail.com', ownerToken:'', ownerExp:0 };

function defaults(){ return JSON.parse(JSON.stringify(DEFAULTS)); }

/* ---------- configuração do backend ---------- */
let CFG;
function loadCfg(){
  try{
    const raw = localStorage.getItem(CKEY);
    CFG = raw ? Object.assign({}, DEFAULTS_CFG, JSON.parse(raw)) : Object.assign({}, DEFAULTS_CFG);
  }catch(e){ CFG = Object.assign({}, DEFAULTS_CFG); }
  return CFG;
}
function saveCfg(){ try{ localStorage.setItem(CKEY, JSON.stringify(CFG)); }catch(e){} }
function cloud(){ return !!(CFG.url && CFG.key); }
loadCfg();

/* ---------- estado local ---------- */
let S;
function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){
      const p = JSON.parse(raw);
      const d = defaults();
      S = Object.assign(d, p);
      if(!Array.isArray(S.services) || !S.services.length) S.services = d.services;
      if(!Array.isArray(S.bookings)) S.bookings = [];
      // catálogo antigo (preços de chute) -> tabela oficial da barbearia
      if((S.catalogVersion || 1) < CATALOG_VERSION){
        S.services = d.services;
        S.catalogVersion = CATALOG_VERSION;
        try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){}
      }
    } else S = defaults();
  }catch(e){ S = defaults(); }
  return S;
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){ toast('Não consegui salvar neste navegador'); } }
load();

/* ============================================================
   CAMADA DE DADOS (API) — decide entre local e Supabase
   ============================================================ */
const API = {
  /* ---- Supabase REST ---- */
  async rest(path, opts = {}){
    const url = CFG.url.replace(/\/+$/, '') + '/rest/v1/' + path;
    const token = opts.token || CFG.key;
    const headers = Object.assign({
      'apikey': CFG.key,
      'Authorization': 'Bearer ' + token,
      'Content-Type': 'application/json'
    }, opts.headers || {});
    const o = Object.assign({}, opts, { headers });
    delete o.token;
    const res = await fetch(url, o);
    const text = await res.text();
    let body = null;
    try{ body = text ? JSON.parse(text) : null; }catch(e){ body = text; }
    if(!res.ok){
      const msg = body && (body.message || body.hint || body.error_description) || ('HTTP ' + res.status);
      throw new Error(msg);
    }
    return body;
  },
  async rpc(fn, args, token){
    return this.rest('rpc/' + fn, { method:'POST', body: JSON.stringify(args), token });
  },

  /* ---- token do dono (Supabase Auth) ---- */
  ownerToken(){
    if(!CFG.ownerToken) return null;
    if(CFG.ownerExp && Date.now() > CFG.ownerExp - 60000) return null;
    return CFG.ownerToken;
  },
  async ownerLogin(email, password){
    const url = CFG.url.replace(/\/+$/, '') + '/auth/v1/token?grant_type=password';
    const res = await fetch(url, {
      method:'POST',
      headers:{ 'apikey': CFG.key, 'Content-Type':'application/json' },
      body: JSON.stringify({ email, password })
    });
    const body = await res.json().catch(()=>({}));
    if(!res.ok){
      const m = body.error_description || body.msg || body.message || ('HTTP ' + res.status);
      throw new Error(m);
    }
    CFG.ownerToken = body.access_token;
    CFG.ownerEmail = (body.user && body.user.email) || email;
    CFG.ownerExp = Date.now() + (Number(body.expires_in || 3600) * 1000);
    saveCfg();
    return { ok:true, email: CFG.ownerEmail };
  },
  ownerOut(){
    CFG.ownerToken = ''; CFG.ownerExp = 0; saveCfg();
  },
  ownerRest(path, opts = {}){
    const t = this.ownerToken();
    if(!t) throw new Error('Sessão expirada, entre de novo.');
    return this.rest(path, Object.assign({}, opts, { token: t }));
  },

  /* ---- leitura do catálogo (preços, grade, horários ocupados) ---- */
  async pullCatalog(){
    if(!cloud()) return { ok:true, local:true };
    try{
      const [set, svc, busy] = await Promise.all([
        this.rest('settings_public?select=*'),
        this.rest('services?select=*&active=eq.true&order=sort.asc'),
        this.rest('busy_slots?select=date,time')
      ]);
      const c = set[0] || {};
      if(c.shop) S.shop = c.shop;
      if(c.handle != null) S.handle = c.handle;
      if(c.owner_whats != null) S.ownerWhats = c.owner_whats;
      if(c.owner_name != null) S.ownerName = c.owner_name;
      if(c.open_hour != null) S.openHour = c.open_hour;
      if(c.close_hour != null) S.closeHour = c.close_hour;
      if(c.lunch_hour != null) S.lunchHour = c.lunch_hour;
      if(c.deposit_pct != null) S.depositPct = Number(c.deposit_pct);
      if(c.max_active_per_wa != null) S.maxActive = Number(c.max_active_per_wa);
      if(Array.isArray(svc) && svc.length){
        S.services = svc.map(s => ({ id:s.id, name:s.name, price:Number(s.price), ico:s.ico }));
      }
      S.busy = busy.map(b => ({ date:b.date, time:String(b.time).slice(0,5) }));
      save();
      return { ok:true };
    }catch(e){
      return { ok:false, error:e.message };
    }
  },

  /* ---- cotação oficial do preço (servidor manda) ---- */
  async quote(serviceId, coupon){
    if(!cloud()){
      const svc = S.services.find(s => s.id === serviceId) || { price:0 };
      let pct = 0, code = '';
      const cp = String(coupon || '').trim().toUpperCase();
      if(cp){
        const f = (S.coupons || []).find(c => c.code.toUpperCase() === cp);
        if(f){ pct = f.pct; code = f.code; }
      }
      const off = Math.round(svc.price * pct) / 100;
      return { ok:true, base:svc.price, coupon:code || null, coupon_pct:pct, off, total: Math.round((svc.price - off)*100)/100 };
    }
    try{
      const r = await this.rpc('quote', { p_service_id: serviceId, p_coupon: coupon || null });
      return r;
    }catch(e){ return { ok:false, error:e.message }; }
  },

  /* ---- criar agendamento ---- */
  async book(payload){
    if(!cloud()){
      // ---- modo local: valida na hora, igual o servidor faria ----
      if(S.bookings.some(b => b.date === payload.date && b.time === payload.time && b.status !== 'cancelado')){
        return { ok:false, error:'horario_ocupado' };
      }
      const q = await this.quote(payload.serviceId, payload.coupon);
      const svc = S.services.find(s => s.id === payload.serviceId) || { name:'—', price:0 };
      const d = fromISO(payload.date);
      const id = 'CC' + pad(d.getDate()) + pad(d.getMonth()+1) + '-' + String(S.seq).padStart(3,'0');
      S.seq++;
      const b = {
        id, code:id, date:payload.date, time:payload.time,
        serviceId:svc.id, serviceName:svc.name, base:svc.price,
        coupon:q.coupon || '', couponPct:q.coupon_pct || 0, total:q.total,
        depositPct: q.deposit_pct || 0, deposit: q.deposit || 0,
        client:{ name:payload.name, wa:payload.wa, email:payload.email || '' },
        pay:{ method:payload.method, last4:payload.last4 || '', status: payload.method === 'pix' ? 'pago' : 'pendente' },
        status: payload.method === 'pix' ? 'pago' : 'pendente',
        createdAt: new Date().toISOString(), mine:true
      };
      S.bookings.push(b); save();
      return { ok:true, booking:b, local:true };
    }
    try{
      const r = await this.rpc('book_slot', {
        p_service_id: payload.serviceId, p_date: payload.date, p_time: payload.time + ':00',
        p_name: payload.name, p_wa: payload.wa, p_email: payload.email || null,
        p_coupon: payload.coupon || null, p_method: payload.method, p_last4: payload.last4 || null
      });
      if(r && r.ok){
        toLocalShape(r.booking);
        await this.pullCatalog();
      }
      return r;
    }catch(e){ return { ok:false, error:e.message }; }
  },

  /* ---- meus agendamentos ---- */
  async mine(){
    if(!cloud()) return S.bookings.filter(b => b.mine);
    const ids = mineIds();
    const out = [];
    for(const id of ids){
      try{
        const b = await this.rpc('get_booking', { p_id:id });
        if(b) out.push(toLocalShape(b));
      }catch(e){ /* id que não existe mais, ignora */ }
    }
    return out;
  },

  /* ---- cancelar ---- */
  async cancel(id, wa){
    if(!cloud()){
      const b = S.bookings.find(x => x.id === id);
      if(!b) return { ok:false, error:'nao_encontrado' };
      b.status = 'cancelado'; save();
      return { ok:true, booking:b };
    }
    try{
      const r = await this.rpc('cancel_booking', { p_id:id, p_wa: wa });
      if(r && r.ok) await this.pullCatalog();
      return r;
    }catch(e){ return { ok:false, error:e.message }; }
  },

  /* ---- painel do dono ---- */
  async day(dateStr){
    if(!cloud()) return S.bookings.filter(b => b.date === dateStr).sort((a,b)=>a.time.localeCompare(b.time));
    try{
      const rows = await this.ownerRest('bookings?select=*&date=eq.' + dateStr + '&order=time.asc');
      return rows.map(toLocalShape);
    }catch(e){ toast('Não consegui carregar a agenda: ' + e.message); return []; }
  },
  async allBookings(){
    if(!cloud()) return S.bookings;
    const rows = await this.ownerRest('bookings?select=*&order=date.desc,time.asc&limit=2000');
    return rows.map(toLocalShape);
  },
  async setStatus(id, status){
    if(!cloud()){
      const b = S.bookings.find(x => x.id === id);
      if(b){ b.status = status; if(b.pay) b.pay.status = status; save(); }
      return { ok:true };
    }
    await this.ownerRest('bookings?id=eq.' + id, { method:'PATCH', body: JSON.stringify({ status }) });
    return { ok:true };
  },
  async saveSettings(patch){
    if(!cloud()) return { ok:true, local:true };
    const body = {
      shop: patch.shop, handle: patch.handle,
      owner_name: patch.ownerName, owner_whats: patch.ownerWhats,
      open_hour: patch.openHour, close_hour: patch.closeHour, lunch_hour: patch.lunchHour,
      deposit_pct: patch.depositPct,
      max_active_per_wa: patch.maxActive
    };
    Object.keys(body).forEach(k => body[k] === undefined && delete body[k]);
    await this.ownerRest('settings?id=eq.1', { method:'PATCH', body: JSON.stringify(body) });
    if(patch.pin) await this.ownerRest('settings?id=eq.1', { method:'PATCH', body: JSON.stringify({ pin: patch.pin }) });
    return { ok:true };
  },
  async saveService(s){
    if(!cloud()) return { ok:true, local:true };
    await this.ownerRest('services', {
      method:'POST',
      headers:{ 'Prefer':'resolution=merge-duplicates' },
      body: JSON.stringify([{ id:s.id, name:s.name, price:s.price, ico:s.ico, sort:s.sort || 0, active:true }])
    });
    return { ok:true };
  },
  async removeService(id){
    if(!cloud()) return { ok:true, local:true };
    // não apaga de verdade: desativa (agendamentos antigos apontam pra ele)
    await this.ownerRest('services?id=eq.' + id, { method:'PATCH', body: JSON.stringify({ active:false }) });
    return { ok:true };
  }
};

/* converte a linha do banco para o formato que a tela usa */
function toLocalShape(b){
  return {
    id: b.id,
    code: b.code || b.id,
    date: b.date,
    time: String(b.time || '').slice(0,5),
    serviceId: b.service_id || b.serviceId,
    serviceName: b.service_name || b.serviceName,
    base: Number(b.base), coupon: b.coupon || '', couponPct: b.coupon_pct || 0,
    total: Number(b.total),
    client: { name: b.client_name || (b.client && b.client.name) || '', wa: b.client_wa || (b.client && b.client.wa) || '', email: b.client_email || (b.client && b.client.email) || '' },
    pay: { method: b.pay_method || (b.pay && b.pay.method) || 'pix', last4: b.pay_last4 || (b.pay && b.pay.last4) || '', status: b.status },
    depositPct: Number(b.deposit_pct || 0),
    deposit: Number(b.deposit || 0),
    status: b.status,
    createdAt: b.created_at || b.createdAt,
    mine: true
  };
}

/* Quantas reservas ativas (futuras) este aparelho já tem daquele WhatsApp.
   É só um aviso antecipado: quem decide de verdade é o banco. */
function ativosDoWa(wa){
  const d = onlyDigits(wa);
  if(!d) return 0;
  const now = Date.now();
  return (U.myList || []).filter(b =>
    b.status !== 'cancelado' &&
    whenOf(b) >= now &&
    onlyDigits(b.client.wa).slice(-10) === d.slice(-10)
  ).length;
}

}



/* ================= UTIL ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl = n => 'R$ ' + Number(n||0).toFixed(2).replace('.',',').replace(/\B(?=(\d{3})+(?!\d))/g,'.');
const pad = n => String(n).padStart(2,'0');
const iso = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const fromISO = s => { const p = s.split('-').map(Number); return new Date(p[0], p[1]-1, p[2]); };
const WD = ['dom','seg','ter','qua','qui','sex','sáb'];
const WDF = ['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
const todayISO = () => iso(new Date());

function fmtDate(s){
  const d = fromISO(s);
  return WDF[d.getDay()] + ', ' + pad(d.getDate()) + '/' + pad(d.getMonth()+1);
}
function fmtShort(s){
  const d = fromISO(s);
  return pad(d.getDate()) + '/' + pad(d.getMonth()+1);
}
function whenOf(b){
  const [y,m,d] = String(b.date).split('-').map(Number);
  const [hh,mm] = String(b.time||'00:00').split(':').map(Number);
  return new Date(y, (m||1)-1, d||1, hh||0, mm||0).getTime();
}
function onlyDigits(s){ return String(s||'').replace(/\D/g,''); }
/* ---- aviso de cancelamento para o dono ---- */
function ownerWa(){

  if(!d) return '';

/* Garante deposit/rest mesmo quando o banco ainda não tem a migração do sinal.
   Assim a tela nunca mostra "R$ 0,00" de sinal por causa de schema desatualizado. */
function normalizaQuote(q){
  if(!q || !q.ok) return q;
  const pct = depPct();
  const total = Number(q.total || 0);
  if(pct <= 0){ q.deposit_pct = 0; q.deposit = 0; q.rest = total; return q; }
  if(q.deposit == null || Number.isNaN(Number(q.deposit))){
    q.deposit_pct = pct;
    q.deposit = Math.round(total * pct) / 100;
    q.rest = Math.round((total - q.deposit) * 100) / 100;
  }
  return q;
}

/* ---- aviso do sinal, reutilizado em todas as telas ---- */
function depPct(){ return Number(S.depositPct != null ? S.depositPct : 30); }
function temSinal(){ return depPct() > 0; }
function avisoSinal(q){
  if(!temSinal()) return '';

       é pago no dia, na barbearia.</p>
    <p class="strong" style="margin-top:10px">Em caso de cancelamento, o sinal não será restituído.</p>
    <p style="font-size:11.5px;color:#b8b0a0;margin-top:8px">Ao confirmar, você concorda com esta condição.</p>

function waLink(phone, text){
  let p = onlyDigits(phone);
  if(p.length && p.length <= 11) p = '55' + p;
  return 'https://wa.me/' + p + '?text=' + encodeURIComponent(text||'');
}
let toastT;
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(()=>t.classList.remove('on'), 3000);
}

/* ================= DISPONIBILIDADE ================= */
function isOpenDay(dateStr){
  const d = fromISO(dateStr);
  return d.getDay() !== 0; // fecha domingo
}
function allSlots(){
  const out = [];
  for(let h = S.openHour; h < S.closeHour; h++){
    if(h === S.lunchHour) continue; // almoço bloqueado
    out.push(pad(h) + ':00');
  }
  return out;
}
function isTaken(dateStr, time){
  // na nuvem a lista de ocupados vem do servidor (sem dado de cliente)
  if(cloud() && Array.isArray(S.busy)){
    if(S.busy.some(b => b.date === dateStr && b.time === time)) return true;
  }
  return S.bookings.some(b => b.date === dateStr && b.time === time && b.status !== 'cancelado');
}
function isPast(dateStr, time){
  const t = fromISO(dateStr);
  const parts = time.split(':').map(Number);
  t.setHours(parts[0], parts[1], 0, 0);
  return t.getTime() <= Date.now();
}
function freeSlots(dateStr){
  return allSlots().filter(t => !isTaken(dateStr, t) && !isPast(dateStr, t));
}
/* primeiro dia (a partir de hoje) que ainda tem horário livre */
function firstOpenDay(){
  const base = new Date();
  for(let i = 0; i < 60; i++){
    const d = new Date(base.getFullYear(), base.getMonth(), base.getDate() + i);
    const ds = iso(d);
    if(isOpenDay(ds) && freeSlots(ds).length) return ds;
  }
  return todayISO();
}

function qrCells(seed){
  let h = 2166136261;
  for(let i = 0; i < seed.length; i++){ h ^= seed.charCodeAt(i); h = Math.imul(h, 16777619); }
  const N = 25, cells = [];
  const finder = (r,c) => {
    const inBox = (r0,c0) => r >= r0 && r < r0+7 && c >= c0 && c < c0+7;
    if(inBox(0,0) || inBox(0,N-7) || inBox(N-7,0)){
      const rr = r < 7 ? r : r - (N-7), cc = c < 7 ? c : c - (N-7);
      const edge = rr === 0 || rr === 6 || cc === 0 || cc === 6;
      const core = rr >= 2 && rr <= 4 && cc >= 2 && cc <= 4;
      return edge || core;
    }
    return null;
  };
  for(let r = 0; r < N; r++){
    for(let c = 0; c < N; c++){
      const f = finder(r,c);
      let on;
      if(f !== null) on = f;
      else { h = Math.imul(h ^ (r*31+c), 2246822519); on = ((h >>> 13) & 1) === 1; }
      cells.push('<i class="' + (on ? 'b' : '') + '"></i>');
    }
  }
  return cells.join('');
}

      </p>
      <p style="font-size:12px;color:#6f6f79;margin:0 0 12px;word-break:break-all">${esc(CFG.url)}</p>
      <button class="btn ghost sm" data-act="cloud-test">Testar conexão</button>
      <button class="btn danger sm" style="margin-top:8px" data-act="cloud-off">Desconectar</button>
    ` : `
      <p style="font-size:13px;color:var(--dim);margin:0 0 12px">
        Sem backend, cada celular guarda a própria agenda e o dono não vê o que o cliente marcou.
        Cole abaixo a URL e a chave pública (anon) do seu projeto Supabase para ligar a agenda compartilhada.
      </p>
      <label class="f"><span>URL do projeto</span><input class="inp" id="c-url" placeholder="https://xxxx.supabase.co" value="${esc(CFG.url)}"></label>
      <label class="f"><span>Chave pública (anon key)</span><input class="inp" id="c-key" placeholder="eyJhbGciOi..." value="${esc(CFG.key)}"></label>
      <label class="f"><span>E-mail do dono (para o painel)</span><input class="inp" id="c-owner" inputmode="email" placeholder="voce@email.com" value="${esc(CFG.ownerEmail)}"></label>
      <button class="btn" style="margin-top:14px" data-act="cloud-on">Ligar agenda online</button>
      <p class="tinynote" style="text-align:left">A chave anon é pública por design, quem protege os dados é a política de acesso do banco.</p>
    `}
  </div>

  <h2 class="sec">Backup dos dados</h2>
  <div class="card">
    <div class="actions" style="margin-top:0">
      <button class="btn ghost sm" data-act="export">Baixar backup</button>
      <button class="btn ghost sm" data-act="import">Restaurar backup</button>
    </div>
  </div>
  <div class="actions"><button class="btn ghost sm" data-act="adm-logout">Sair do painel</button></div>`;
}

/* ================= AÇÕES ================= */
async function toPay(){
  U.client.name = ($('#i-name')?.value || '').trim();
  U.client.wa = ($('#i-wa')?.value || '').trim();
  U.client.email = ($('#i-email')?.value || '').trim();
  U.coupon = ($('#i-coupon')?.value || '').trim().toUpperCase();

  if(U.client.name.length < 3){ toast('Escreve o nome completo'); return; }
  const dg = onlyDigits(U.client.wa);
  if(dg.length < 10 || dg.length > 11){ toast('WhatsApp com DDD (10 ou 11 dígitos)'); return; }
  if(U.client.email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(U.client.email)){ toast('E-mail inválido'); return; }

  // aviso antecipado: este número já tem horário ativo (o banco é quem barra)
  const max = Number(S.maxActive || 0);
  if(max > 0){
    const meus = await API.mine().catch(()=>U.myList||[]);
    U.myList = meus;
    const ativos = (meus || []).filter(b => b.status !== 'cancelado' && whenOf(b) >= Date.now()
      && onlyDigits(b.client.wa).slice(-10) === dg.slice(-10)).length;
    if(ativos >= max){
      toast('Você já tem ' + (max>1? max+' horários':'um horário') + ' marcado. Cancele em "Meus" para marcar outro.');
      U.tab = 'meus'; render(); return;
    }
  }

  U.quote = normalizaQuote(await API.quote(U.service, U.coupon));
  if(U.quote.coupon && U.coupon) toast('Cupom aplicado: −' + U.quote.coupon_pct + '%');
  else if(U.coupon) toast('Cupom inválido, segue sem desconto');
  U.step = 3; render();
}

async function finishPayment(withCard){
  let last4 = '';
  if(withCard){
    const num = onlyDigits($('#c-num')?.value || '');
    const nm = ($('#c-name')?.value || '').trim();
    const exp = ($('#c-exp')?.value || '').trim();
    const cvv = onlyDigits($('#c-cvv')?.value || '');
    if(num.length < 13){ toast('Número do cartão incompleto'); return; }
    if(nm.length < 3){ toast('Nome no cartão incompleto'); return; }
    if(!/^\d{2}\/\d{2}$/.test(exp)){ toast('Validade no formato MM/AA'); return; }
    if(cvv.length < 3){ toast('CVV inválido'); return; }
    last4 = num.slice(-4);
  }
  if(isTaken(U.date, U.time) || isPast(U.date, U.time)){
    toast('Esse horário acabou de ser pego. Escolha outro.');
    U.step = 1; U.time = null; U.quote = null; render(); return;
  }

  const btn = document.querySelector('[data-act="pay"]');
  if(btn){ btn.disabled = true; btn.innerHTML = '<span class="spin"></span>Confirmando…'; }

  const r = await API.book({
    serviceId: U.service, date: U.date, time: U.time,
    name: U.client.name, wa: U.client.wa, email: U.client.email,
    coupon: U.coupon, method: U.method, last4
  });

  if(!r.ok){
    const msg = ({
      horario_ocupado:'Esse horário acabou de ser pego. Escolha outro.',
      horario_de_almoco:'Esse horário é do almoço.',
      fora_do_horario:'Fora do horário de funcionamento.',
      domingo_fechado:'Domingo é fechado.',
      horario_passado:'Esse horário já passou.',
      limite_reservas:'Você já tem um horário marcado. Cancele o anterior para marcar outro.'
    })[r.error] || ('Não consegui agendar: ' + r.error);
    toast(msg);
    if(r.error === 'horario_ocupado'){ U.step = 1; U.time = null; await API.pullCatalog(); }
    render(); return;
  }

  const b = cloud() ? toLocalShape(r.booking) : r.booking;
  addMineId(b.id, U.client.wa);
  if(!cloud()) b.mine = true;

  U.last = b;
  U.step = 4;
  U.service = null; U.time = null; U.coupon = ''; U.quote = null;
  U.client = { name:'', wa:'', email:'' };
  render();
  setTimeout(() => toast('Pagamento aprovado (simulado)'), 120);
}

async function loadMine(){
  U.loading = true; render();
  U.myList = await API.mine();
  U.loading = false; render();
}

async function loadAdminDay(){
  U.adminDay = await API.day(U.adminDate);
  if(cloud()) await API.pullCatalog();
  render();
}
async function loadAdminAll(){
  try{ U.adminAll = await API.allBookings(); }catch(e){ U.adminAll = S.bookings; }
  render();
}

/* ================= EVENTOS ================= */
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]');
  if(!el) return;
  const act = el.dataset.act;

  if(act === 'tab'){
    U.tab = el.dataset.tab;
    if(U.tab === 'agendar' && U.step === 4) U.step = 0;
    render();
    if(U.tab === 'meus') await loadMine();
    return;
  }

  if(act === 'pick-service'){ U.service = el.dataset.id; U.time = null; render(); return; }
  if(act === 'pick-date'){ U.date = el.dataset.d; U.time = null; render(); return; }
  if(act === 'pick-time'){ U.time = el.dataset.t; render(); return; }
  if(act === 'go-step'){
    const n = Number(el.dataset.step);
    if(n === 1 && !U.service){ toast('Escolha um serviço'); return; }
    if(n === 2 && !U.time){ toast('Escolha um horário'); return; }
    if(n === 1 && !freeSlots(U.date).length){ U.date = firstOpenDay(); U.time = null; }
    U.step = n; render(); return;
  }
  if(act === 'to-pay'){ await toPay(); return; }
  if(act === 'method'){ U.method = el.dataset.m; render(); return; }
  if(act === 'pay'){ await finishPayment(el.dataset.withCard === '1'); return; }
  if(act === 'new'){ U.step = 0; U.tab = 'agendar'; render(); return; }
  if(act === 'meus-cancel'){
    const id = el.dataset.id;
    if(!confirm('Cancelar este horário?')) return;
    let wa = myWaMap()[id] || '';
    if(!wa){
      wa = prompt('Confirme o WhatsApp usado no agendamento:');
      if(wa == null) return;
    }
    const r = await API.cancel(id, wa);
    if(r.ok){
      U.tab = 'meus';
      toast('Cancelado. Avise o barbeiro no WhatsApp.');
      await loadMine();
    }
    else toast(r.error === 'whatsapp_nao_confere' ? 'WhatsApp não confere' : 'Não consegui cancelar');
    return;
  }
  if(act === 'copy-pix'){
    const txt = document.querySelector('.code')?.textContent || '';
    navigator.clipboard?.writeText(txt).then(()=>toast('Código copiado'), ()=>toast('Selecione e copie o código'));
    return;
  }

  /* painel */
  if(act === 'login'){
    const v = ($('#pin')?.value || '').trim();
    if(v === String(S.pin)){ U.admin = true; render(); await loadAdminDay(); }
    else toast('PIN incorreto');
    return;
  }
  if(act === 'login-cloud'){
    const email = ($('#ownerEmail')?.value || '').trim();
    const pass  = ($('#ownerPass')?.value || '');
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ toast('E-mail inválido'); return; }
    if(pass.length < 4){ toast('Digite a senha'); return; }
    CFG.ownerEmail = email; saveCfg();   // não perde o e-mail se errar a senha
    const btn = el; btn.disabled = true; btn.innerHTML = '<span class="spin"></span>Entrando…';
    try{
      await API.ownerLogin(email, pass);
      U.admin = true; U.ownerAuthError = '';
      render(); await loadAdminDay();
    }catch(err){
      U.ownerAuthError = /invalid|credentials|grant/i.test(err.message)
        ? 'E-mail ou senha incorretos.'
        : err.message;
      render();
    }
    return;
  }
  if(act === 'adm-logout'){ U.admin = false; if(cloud()) API.ownerOut(); render(); return; }
  if(act === 'adm-tab'){
    U.adminTab = el.dataset.t; render();
    if(U.adminTab === 'clientes') await loadAdminAll();
    return;
  }
  if(act === 'adm-day'){
    const d = fromISO(U.adminDate);
    d.setDate(d.getDate() + Number(el.dataset.delta));
    U.adminDate = iso(d);
    await loadAdminDay(); return;
  }
  if(act === 'adm-pay'){
    await API.setStatus(el.dataset.id, 'pago');
    toast('Pagamento confirmado');
    if(cloud()) await API.pullCatalog();
    await loadAdminDay(); return;
  }
  if(act === 'adm-cancel'){
    if(!confirm('Cancelar este horário? Ele volta a ficar livre.')) return;
    await API.setStatus(el.dataset.id, 'cancelado');
    toast('Cancelado, horário liberado');
    if(cloud()) await API.pullCatalog();
    await loadAdminDay(); return;
  }

  /* ajustes */
  if(act === 'svc-add'){
    const id = 'svc-' + Date.now().toString(36);
    S.services.push({ id, name:'Novo serviço', price:0, ico:'✂️' });
    save(); render(); return;
  }
  if(act === 'svc-del'){
    if(S.services.length <= 1){ toast('Precisa ter pelo menos um serviço'); return; }
    const id = el.dataset.id;
    S.services = S.services.filter(s => s.id !== id);
    save();
    if(cloud()) await API.removeService(id);
    render(); return;
  }
  if(act === 'save-settings'){
    const updates = [];
    document.querySelectorAll('.svcrow').forEach(row => {
      const id = row.dataset.sid;
      const s = S.services.find(x => x.id === id);
      if(!s) return;
      const nm = row.querySelector('[data-f="name"]').value.trim();
      const pv = parseFloat(row.querySelector('[data-f="price"]').value.replace(',', '.'));
      if(nm) s.name = nm;
      s.price = isNaN(pv) ? s.price : Math.max(0, pv);
      updates.push(s);
    });
    const op = Number($('#s-open').value), cl = Number($('#s-close').value), lu = Number($('#s-lunch').value);
    if(op >= 0 && op < 24) S.openHour = op;
    if(cl > S.openHour && cl <= 24) S.closeHour = cl;
    if(lu >= S.openHour && lu < S.closeHour) S.lunchHour = lu;
    S.shop = $('#s-shop').value.trim() || S.shop;
    S.handle = $('#s-handle').value.trim();
    S.ownerWhats = $('#s-wa').value.trim();
    const own = $('#s-owner');
    if(own && own.value.trim()) S.ownerName = own.value.trim();
    const pinEl = $('#s-pin');
    if(pinEl){ const pin = (pinEl.value || '').trim(); if(/^\d{4,6}$/.test(pin)) S.pin = pin; }
    const depEl = $('#s-dep');
    if(depEl){ const dp = Number(onlyDigits(depEl.value)); if(dp >= 0 && dp <= 100) S.depositPct = dp; }
    const mwEl = $('#s-maxwa');
    if(mwEl){ const mw = Number(onlyDigits(mwEl.value)); if(mw >= 0 && mw <= 10) S.maxActive = mw; }
    save(); paintBrand();

    if(cloud()){
      try{
        for(const s of updates) await API.saveService(s);
        await API.saveSettings({ shop:S.shop, handle:S.handle, ownerName:S.ownerName, ownerWhats:S.ownerWhats, openHour:S.openHour, closeHour:S.closeHour, lunchHour:S.lunchHour, depositPct:S.depositPct, maxActive:S.maxActive });
        await API.pullCatalog();
        toast('Ajustes salvos na nuvem');
      }catch(err){ toast('Salvei aqui, mas a nuvem recusou: ' + err.message); }
    } else toast('Ajustes salvos');

    render(); return;
  }

  /* nuvem */
  if(act === 'cloud-on'){
    const url = ($('#c-url')?.value || '').trim();
    const key = ($('#c-key')?.value || '').trim();
    const owner = ($('#c-owner')?.value || '').trim();
    if(!/^https?:\/\//.test(url)){ toast('URL inválida'); return; }
    if(key.length < 20){ toast('Chave anon inválida'); return; }
    CFG.url = url.replace(/\/+$/,''); CFG.key = key; CFG.ownerEmail = owner; saveCfg();
    const r = await API.pullCatalog();
    if(r.ok){ toast('Agenda online ligada'); paintBrand(); render(); }
    else { toast('Não conectou: ' + r.error); CFG.url=''; CFG.key=''; saveCfg(); render(); }
    return;
  }
  if(act === 'cloud-test'){
    const r = await API.pullCatalog();
    toast(r.ok ? 'Conexão ok · ' + S.services.length + ' serviços' : 'Falhou: ' + r.error);
    return;
  }
  if(act === 'cloud-off'){
    if(!confirm('Desligar a agenda online neste aparelho? Os dados já baixados continuam aqui.')) return;
    CFG.url = ''; CFG.key = ''; saveCfg(); render(); toast('Agenda online desligada');
    return;
  }

  if(act === 'export'){
    const blob = new Blob([JSON.stringify(S, null, 2)], { type:'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'coast-club-backup-' + todayISO() + '.json';
    a.click(); URL.revokeObjectURL(a.href); return;
  }
  if(act === 'import'){
    const inp = document.createElement('input');
    inp.type = 'file'; inp.accept = '.json,application/json';
    inp.onchange = () => {
      const f = inp.files[0]; if(!f) return;
      const rd = new FileReader();
      rd.onload = () => {
        try{
          const p = JSON.parse(rd.result);
          if(!p || typeof p !== 'object') throw 0;
          S = Object.assign(defaults(), p);
          if(!Array.isArray(S.bookings)) S.bookings = [];
          save(); paintBrand(); toast('Backup restaurado'); render();
        }catch(err){ toast('Arquivo inválido'); }
      };
      rd.readAsText(f);
    };
    inp.click(); return;
  }
});

/* ================= BOOT ================= */
function paintBrand(){
  $('#shopName').textContent = S.shop;
  $('#shopHandle').textContent = S.handle;
  document.title = S.shop + ' · Agendamento';
}
async function boot(){
  paintBrand();
  render();
  if(cloud()){
    const r = await API.pullCatalog();
    if(r.ok){ paintBrand(); render(); }
    else { toast('Sem conexão com a agenda: ' + r.error); }
  }
}
boot();
</script>
